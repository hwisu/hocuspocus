name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.2.5-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      s3mock:
        image: adobe/s3mock:5.1.0@sha256:e9fd12472aa4381458c83292acf2b3aed9920cf1e75b853d0a404d07fde8ad16
        env:
          COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: documents
        ports:
          - 9090:9090
        options: >-
          --health-cmd "wget --spider -q http://localhost:9090/favicon.ico"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Check out the pinned YKS engine
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: hwisu/yks
          ref: 8a2bd18b58ad69ac646679c9174a167a16ac8b01
          path: yks

      - name: Set up JDK 21
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install compatibility harness
        run: pnpm install --frozen-lockfile

      - name: Lint compatibility harness
        run: pnpm lint:compat

      - name: Install pinned YKS oracle dependencies
        run: npm ci --prefix yks

      - name: Verify the pinned YKS engine
        run: >-
          ./yks/gradlew -p yks check consumerSmokeTest publishToMavenLocal --no-daemon
          -PreleaseVersion=0.2.10
          -PbuildRevision=8a2bd18b58ad69ac646679c9174a167a16ac8b01

      - name: Run JVM tests
        run: >-
          ./gradlew -Pyks.localPath="$GITHUB_WORKSPACE/yks"
          check consumerSmokeTest consumerKotlinCompatibilityTest --no-daemon
        env:
          REDIS_URL: redis://localhost:6379
          S3_ENDPOINT: http://localhost:9090
          AWS_ACCESS_KEY_ID: foo
          AWS_SECRET_ACCESS_KEY: bar
          AWS_REGION: us-east-1

      - name: Run bounded JVM performance scenarios
        run: ./gradlew -Pyks.localPath="$GITHUB_WORKSPACE/yks" :hocuspocus-benchmark:performanceSmoke --no-daemon

      - name: Verify benchmark process accounting
        run: pnpm test:jvm:benchmark-stats

      - name: Verify the upstream server test matrix
        run: pnpm test:jvm:matrix

      - name: Check locked JVM runtime dependencies
        run: pnpm test:jvm:security

      - name: Audit compatibility harness dependencies
        run: pnpm audit --audit-level=high

      - name: Run the Hocuspocus Provider v4 oracle
        run: pnpm test:jvm:interop
        env:
          YKS_LOCAL_PATH: ${{ github.workspace }}/yks

      - name: Run the Node-to-JVM migration oracle
        run: pnpm test:jvm:migration
        env:
          YKS_LOCAL_PATH: ${{ github.workspace }}/yks
          HOCUSPOCUS_BENCHMARK_REDIS_URI: redis://localhost:6379
