name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.2.5-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Check out the pinned YKS engine
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: hwisu/yks
          ref: e5cfd0029b6403a9caf81c10253ac940c96e7d77
          path: yks

      - name: Set up JDK 21
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install pinned YKS oracle dependencies
        run: npm ci --prefix yks

      - name: Verify the pinned YKS engine
        run: ./yks/gradlew -p yks check consumerSmokeTest --no-daemon

      - name: Run JVM tests
        run: ./jvm/gradlew -p jvm -Pyks.localPath="$GITHUB_WORKSPACE/yks" check --no-daemon
        env:
          REDIS_URL: redis://localhost:6379

      - name: Run bounded JVM performance scenarios
        run: ./jvm/gradlew -p jvm -Pyks.localPath="$GITHUB_WORKSPACE/yks" :hocuspocus-benchmark:performanceSmoke --no-daemon

      - name: Verify benchmark process accounting
        run: pnpm test:jvm:benchmark-stats

      - name: Verify the upstream server test matrix
        run: pnpm test:jvm:matrix

      - name: Check locked JVM runtime dependencies
        run: pnpm test:jvm:security

      - name: Run the Hocuspocus Provider v4 oracle
        run: pnpm test:jvm:interop
        env:
          YKS_LOCAL_PATH: ${{ github.workspace }}/yks
