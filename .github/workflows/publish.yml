name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Check out YKS 0.2.10
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: hwisu/yks
          ref: v0.2.10
          path: yks

      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate release tag
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          semver_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$version" =~ $semver_pattern ]]; then
            echo "Tag '$GITHUB_REF_NAME' must be v<SemVer>." >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Require a commit reachable from main
        shell: bash
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Release tag '$GITHUB_REF_NAME' must point to a commit reachable from main." >&2
            exit 1
          fi

      - name: Publish the pinned YKS release to Maven Local
        run: >-
          ./yks/gradlew -p yks publishToMavenLocal --no-daemon
          -PreleaseVersion=0.2.10
          -PbuildRevision=$(git -C yks rev-parse HEAD)

      - name: Verify reproducible Hocuspocus artifacts
        env:
          BUILD_REVISION: ${{ github.sha }}
          YKS_LOCAL_PATH: ${{ github.workspace }}/yks
        run: bash scripts/verify-reproducible-artifacts.sh "${{ steps.version.outputs.value }}"

      - name: Verify modules and standalone consumer
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: >-
          ./gradlew -Pyks.localPath="$GITHUB_WORKSPACE/yks"
          clean check consumerSmokeTest consumerKotlinCompatibilityTest --no-daemon
          "-PreleaseVersion=$RELEASE_VERSION"
          "-PbuildRevision=$GITHUB_SHA"

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Check out YKS 0.2.10
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: hwisu/yks
          ref: v0.2.10
          path: yks

      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: >-
          ./gradlew -Pyks.localPath="$GITHUB_WORKSPACE/yks"
          publishAllPublicationsToGitHubPackagesRepository --no-daemon
          "-PreleaseVersion=$RELEASE_VERSION"
          "-PbuildRevision=$GITHUB_SHA"

  verify-consumer:
    needs:
      - verify
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Verify consumption from GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.YKS_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
          GRADLE_USER_HOME: ${{ runner.temp }}/hocuspocus-remote-consumer-gradle
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if ./gradlew -p consumer-smoke clean run --no-daemon --refresh-dependencies \
              "-PhocuspocusVersion=$RELEASE_VERSION" \
              "-PhocuspocusRepositoryUrl=https://maven.pkg.github.com/hwisu/hocuspocus" \
              "-PyksRepositoryUrl=https://maven.pkg.github.com/hwisu/yks"; then
              exit 0
            fi
            if [[ "$attempt" -eq 6 ]]; then
              exit 1
            fi
            if [[ "$attempt" -lt 4 ]]; then
              sleep $((attempt * 5))
            else
              sleep 30
            fi
          done
