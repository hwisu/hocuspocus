name: Scheduled soak

on:
  schedule:
    - cron: '17 18 * * 6'
  workflow_dispatch:
    inputs:
      duration:
        description: Soak duration understood by Kotlin Duration
        required: false
        default: 30m

permissions:
  contents: read

concurrency:
  group: scheduled-soak
  cancel-in-progress: false

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Check out the audited YKS engine
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: hwisu/yks
          ref: a155e56fd46c50a2fcac31895bfab288454e2ffe
          path: yks

      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Run bounded JVM soak
        env:
          SOAK_DURATION: ${{ inputs.duration || '30m' }}
        run: >-
          ./gradlew -Pyks.localPath="$GITHUB_WORKSPACE/yks"
          :hocuspocus-benchmark:soak --no-daemon
          "-PsoakDuration=$SOAK_DURATION"
